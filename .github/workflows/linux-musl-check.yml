name: linux-musl-check

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/linux-musl-check.yml'
      - '.github/workflows/release.yml'
  push:
    branches:
      - 'codex/**'
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/linux-musl-check.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-musl-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: x86_64-unknown-linux-musl

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-fund --no-audit

      - name: Test forwarding shims
        run: node --test crates/hub/assets/*.test.mjs

      - name: Test frontend
        run: npm --prefix frontend test -- --environment jsdom

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install musl toolchain
        run: |
          # Fall back to building musl-gcc from source when the Ubuntu archive is unreachable.
          if timeout 300 sh -c 'sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools'; then exit 0; fi
          curl -fsSL --retry 3 -o /tmp/musl.tar.gz https://musl.libc.org/releases/musl-1.2.5.tar.gz
          echo "a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4  /tmp/musl.tar.gz" | sha256sum -c
          tar -xzf /tmp/musl.tar.gz -C /tmp
          (cd /tmp/musl-1.2.5 && ./configure --prefix="$HOME/musl" && make -j"$(nproc)" && make install)
          # Upstream specs lack static-pie (Ubuntu patches it in); Rust links static-pie with crt-static.
          M="$HOME/musl"
          sed -i -e "s|%{!shared: $M/lib/Scrt1.o}|%{!shared: %{static-pie:$M/lib/rcrt1.o} %{!static-pie:$M/lib/Scrt1.o}}|" \
            -e 's|^-dynamic-linker \(\S*\) -nostdlib|%{!static-pie:-dynamic-linker \1} -nostdlib %{static-pie:-static -pie --no-dynamic-linker -z text}|' \
            "$M/lib/musl-gcc.specs"
          grep -q rcrt1.o "$M/lib/musl-gcc.specs"
          echo "$HOME/musl/bin" >> "$GITHUB_PATH"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: musl-check-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            musl-check-${{ runner.os }}-

      # cargo test subsumes cargo check: it compiles every target (lib, bins,
      # tests) for the musl release target AND runs the full suite — one job,
      # one invocation. The suite is self-contained (no external binaries).
      - name: Build and run all Rust tests for Linux musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo test --locked --workspace --all-targets --target ${{ env.TARGET }}
